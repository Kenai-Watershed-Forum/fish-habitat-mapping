project:
  type: book
  output-dir: docs
  execute-dir: project

book:
  title: "fish-habitat-mapping"
  repo-url: https://github.com/Kenai-Watershed-Forum/fish-habitat-mapping
  author: "Benjamin Meyer"
  date: today
  chapters:
    - index.qmd
    - chapters/intro.qmd
    - chapters/acknowledgements.qmd
    - chapters/arcgis_data_intake.qmd
    - part: "Methods - Geographic Data"
      chapters:
        - chapters/geographic_data/focus_areas.qmd
        - chapters/geographic_data/field_site_selection.qmd
        - chapters/geographic_data/netmap_prep.qmd
    - part: "Methods - Fish Habitat Data"
      chapters:
        - chapters/fish_habitat_data/new_fish_obs.qmd
        - chapters/fish_habitat_data/existing_fish_obs.qmd
    - chapters/results.qmd
    - chapters/discussion.qmd
    - chapters/references.qmd

bibliography: references.bib

format:
  html:
    theme:
      - cosmo
      - brand
    navbar:
      tools:
        - icon: download
          href: fish-habitat-mapping.docx
          text: Download as Word
  docx:
    toc: true
    toc-depth: 3
    number-sections: true
#  pdf:
#    documentclass: scrreprt

editor: visual
